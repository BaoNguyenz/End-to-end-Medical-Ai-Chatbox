  <text x="510" y="642" text-anchor="middle" font-size="11" font-weight="bold" fill="#fde68a">Cross-Encoder</text>
  <text x="510" y="660" text-anchor="middle" font-size="9" fill="#fcd34d">ms-marco-MiniLM-L-6</text>

  <rect x="615" y="620" width="170" height="55" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="700" y="642" text-anchor="middle" font-size="11" font-weight="bold" fill="#6ee7b7">MMR Diversity</text>
  <text x="700" y="660" text-anchor="middle" font-size="9" fill="#a7f3d0">Lambda = 0.7</text>

