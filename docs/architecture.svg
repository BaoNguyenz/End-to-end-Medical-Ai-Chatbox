  <text x="510" y="323" text-anchor="middle" font-size="10" fill="#a7f3d0">Cosine Sim ≥ 92%</text>
  <text x="510" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#fbbf24">&lt; 10ms (Zero Cost)</text>

