<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1060" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.5" opacity="0.4"/>
    </pattern>

    <!-- Shadow Filter -->
    <filter id="boxShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowEmerald" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#c084fc"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#f87171"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1320" height="1060" fill="#090d16"/>
  <rect width="1320" height="1060" fill="url(#grid)"/>

  <!-- ==================== MAIN TITLE ==================== -->
  <g transform="translate(660, 35)">
    <text x="0" y="0" text-anchor="middle" font-size="22" font-weight="800" fill="#f8fafc" letter-spacing="1">
      GALEMED AI — DUAL-PIPELINE GRAPHRAG &amp; SEMANTIC CACHE ARCHITECTURE
    </text>
    <text x="0" y="24" text-anchor="middle" font-size="12" font-weight="500" fill="#94a3b8">
      The Gale Encyclopedia of Medicine · Hybrid Search (RRF) · Neo4j Knowledge Graph · Redis Stack · Cross-Encoder
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- 1. RIGHT SUBGRAPH: OFFLINE DATA INGESTION PIPELINE                        -->
  <!-- ========================================================================= -->
  <g transform="translate(680, 80)">
    <!-- Subgraph Container -->
    <rect x="0" y="0" width="600" height="320" rx="14" fill="#141c2e" stroke="#334155" stroke-width="1.5" opacity="0.95" filter="url(#boxShadow)"/>
    <text x="300" y="26" text-anchor="middle" font-size="12" font-weight="800" fill="#f8fafc" letter-spacing="0.8">
      OFFLINE DATA INGESTION PIPELINE
    </text>

    <!-- 1.1 Source Documents -->
    <rect x="210" y="45" width="180" height="40" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="300" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#f8fafc">Gale Medical Docs</text>

    <!-- Arrow down -->
    <line x1="300" y1="85" x2="300" y2="110" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowGray)"/>

    <!-- 1.2 Semantic Chunking -->
    <rect x="180" y="110" width="240" height="42" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="300" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#6ee7b7">Semantic Section Chunking</text>

    <!-- Branch Lines -->
    <path d="M 300 152 L 300 175 M 100 175 L 500 175 L 500 195 M 100 175 L 100 195 M 300 175 L 300 195" fill="none" stroke="#64748b" stroke-width="1.5"/>

    <!-- 1.3 Step Cards -->
    <!-- Text Embeddings -->
    <rect x="20" y="195" width="160" height="38" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
    <text x="100" y="219" text-anchor="middle" font-size="11" font-weight="600" fill="#fca5a5">Text Embeddings (MiniLM)</text>

    <!-- BM25 Indexing -->
    <rect x="220" y="195" width="160" height="38" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="300" y="219" text-anchor="middle" font-size="11" font-weight="600" fill="#6ee7b7">BM25 Lexical Indexing</text>

    <!-- LLM Entity-Relation Extract -->
    <rect x="420" y="195" width="160" height="38" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
    <text x="500" y="219" text-anchor="middle" font-size="11" font-weight="600" fill="#d8b4fe">LLM Entity Extraction</text>

    <!-- Arrows down to DB Cylinders -->
    <line x1="100" y1="233" x2="100" y2="255" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowRed)"/>
    <line x1="300" y1="233" x2="300" y2="255" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowEmerald)"/>
    <line x1="500" y1="233" x2="500" y2="255" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrowPurple)"/>

    <!-- 1.4 Databases Cylinders -->
    <!-- Qdrant -->
    <rect x="20" y="255" width="160" height="48" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
    <text x="100" y="277" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">Qdrant Vector DB</text>
    <text x="100" y="293" text-anchor="middle" font-size="10" fill="#fca5a5">13,350 Chunk Embeddings</text>

    <!-- BM25 -->
    <rect x="220" y="255" width="160" height="48" rx="8" fill="#022c22" stroke="#10b981" stroke-width="2"/>
    <text x="300" y="277" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">BM25 Retriever</text>
    <text x="300" y="293" text-anchor="middle" font-size="10" fill="#6ee7b7">Exact Medical Keyword Index</text>

    <!-- Neo4j -->
    <rect x="420" y="255" width="160" height="48" rx="8" fill="#3b0764" stroke="#a855f7" stroke-width="2"/>
    <text x="500" y="277" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">Neo4j Graph DB</text>
    <text x="500" y="293" text-anchor="middle" font-size="10" fill="#d8b4fe">288 Diseases · 333 Meds · 508 Sym</text>
  </g>


  <!-- ========================================================================= -->
  <!-- 2. LEFT SUBGRAPH: ONLINE RETRIEVAL PIPELINE (Real-Time)                   -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 80)">
    <!-- Subgraph Container -->
    <rect x="0" y="0" width="600" height="740" rx="14" fill="#141c2e" stroke="#f59e0b" stroke-width="1.5" opacity="0.95" filter="url(#boxShadow)"/>
    <text x="300" y="26" text-anchor="middle" font-size="12" font-weight="800" fill="#fbbf24" letter-spacing="0.8">
      ONLINE RETRIEVAL PIPELINE (Real-Time)
    </text>

    <!-- 2.1 User Query -->
    <rect x="200" y="45" width="200" height="40" rx="8" fill="#451a03" stroke="#f97316" stroke-width="2"/>
    <text x="300" y="70" text-anchor="middle" font-size="13" font-weight="800" fill="#ffedd5">User / Clinical Query</text>

    <!-- Arrow down -->
    <line x1="300" y1="85" x2="300" y2="105" stroke="#f97316" stroke-width="1.5" marker-end="url(#arrowAmber)"/>

    <!-- 2.2 Safety & Redis Cache Split -->
    <rect x="130" y="105" width="340" height="52" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="300" y="126" text-anchor="middle" font-size="11" font-weight="700" fill="#f87171">🚨 Emergency Check &amp; Redis Semantic Cache</text>
    <text x="300" y="145" text-anchor="middle" font-size="10" fill="#94a3b8">HNSW 384-dim Index · Cosine Sim ≥ 92%</text>

    <!-- Cache HIT Fast Path Arrow (Left) -->
    <path d="M 130 131 L 50 131 L 50 700 L 200 700" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowEmerald)"/>
    <rect x="20" y="380" width="60" height="60" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="50" y="405" text-anchor="middle" font-size="9" font-weight="800" fill="#34d399">CACHE</text>
    <text x="50" y="420" text-anchor="middle" font-size="9" font-weight="800" fill="#34d399">HIT</text>
    <text x="50" y="433" text-anchor="middle" font-size="8" fill="#a7f3d0">&lt; 10ms</text>

    <!-- Arrow down to Router (Cache MISS) -->
    <line x1="300" y1="157" x2="300" y2="185" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowAmber)"/>

    <!-- 2.3 Query Router (Diamond) -->
    <g transform="translate(300, 220)">
      <polygon points="0,-28 75,0 0,28 -75,0" fill="#451a03" stroke="#f59e0b" stroke-width="2"/>
      <text x="0" y="4" text-anchor="middle" font-size="12" font-weight="800" fill="#fef08a">Query Router</text>
    </g>

    <!-- Router Splits -->
    <!-- Left path: Hybrid Search -->
    <path d="M 225 220 L 150 220 L 150 265" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
    <text x="180" y="240" font-size="10" font-weight="600" fill="#94a3b8">Hybrid Search</text>

    <!-- Right path: GraphRAG -->
    <path d="M 375 220 L 460 220 L 460 365" fill="none" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
    <text x="420" y="240" font-size="10" font-weight="600" fill="#c084fc">GraphRAG</text>

    <!-- 2.4 Query Transformation Box -->
    <rect x="50" y="265" width="200" height="35" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="150" y="287" text-anchor="middle" font-size="11" font-weight="700" fill="#fef08a">Query Transformation</text>

    <!-- Branch to HyDE & Decomposer -->
    <path d="M 150 300 L 150 315 M 85 315 L 215 315 L 215 325 M 85 315 L 85 325" fill="none" stroke="#64748b" stroke-width="1.5"/>

    <rect x="25" y="325" width="120" height="32" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="85" y="345" text-anchor="middle" font-size="10" fill="#fde68a">HyDE Document</text>

    <rect x="155" y="325" width="120" height="32" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="215" y="345" text-anchor="middle" font-size="10" fill="#fde68a">Decomposer Subs</text>

    <!-- Lines to Hybrid Search Engine -->
    <path d="M 85 357 L 85 375 L 150 375 M 215 357 L 215 375 L 150 375 L 150 385" fill="none" stroke="#64748b" stroke-width="1.5"/>

    <!-- 2.5 Hybrid Search Engine Box -->
    <rect x="60" y="385" width="180" height="38" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="150" y="409" text-anchor="middle" font-size="12" font-weight="800" fill="#38bdf8">Hybrid Search Engine</text>

    <!-- 2.6 GraphRAG Search Box (Right) -->
    <rect x="370" y="365" width="180" height="38" rx="8" fill="#3b0764" stroke="#a855f7" stroke-width="2"/>
    <text x="460" y="389" text-anchor="middle" font-size="12" font-weight="800" fill="#d8b4fe">GraphRAG Search</text>

    <!-- Down to RRF Fusion -->
    <line x1="150" y1="423" x2="150" y2="465" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
    <text x="105" y="445" font-size="10" fill="#94a3b8">Top 50 Chunks</text>

    <rect x="80" y="465" width="140" height="35" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="150" y="487" text-anchor="middle" font-size="12" font-weight="700" fill="#6ee7b7">RRF Fusion</text>

    <!-- Merge Candidates Box -->
    <!-- Line from RRF -->
    <path d="M 150 500 L 150 535 L 260 535" fill="none" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowEmerald)"/>
    <!-- Line from GraphRAG -->
    <path d="M 460 403 L 460 535 L 340 535" fill="none" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
    <text x="400" y="525" font-size="10" fill="#c084fc">Top 5 Relations</text>

    <rect x="200" y="520" width="200" height="38" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="300" y="544" text-anchor="middle" font-size="12" font-weight="800" fill="#6ee7b7">Merge Candidates</text>

    <!-- 2.7 Post-Retrieval Pipeline -->
    <line x1="300" y1="558" x2="300" y2="585" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowGray)"/>
    <text x="305" y="575" font-size="10" fill="#94a3b8">Candidate Chunks</text>

    <!-- Cross-Encoder Reranker -->
    <rect x="180" y="585" width="240" height="36" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="300" y="607" text-anchor="middle" font-size="11" font-weight="700" fill="#a7f3d0">Cross-Encoder Reranker</text>

    <line x1="300" y1="621" x2="300" y2="645" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowEmerald)"/>
    <text x="305" y="636" font-size="10" fill="#94a3b8">Top 20 Chunks</text>

    <!-- MMR Diversity Filter -->
    <rect x="180" y="645" width="240" height="36" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="300" y="667" text-anchor="middle" font-size="11" font-weight="700" fill="#a7f3d0">MMR Diversity Filter (λ=0.7)</text>

    <line x1="300" y1="681" x2="300" y2="700" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowEmerald)"/>

    <!-- Final Context Box -->
    <rect x="180" y="700" width="240" height="32" rx="6" fill="#065f46" stroke="#34d399" stroke-width="2"/>
    <text x="300" y="721" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">✓ Final Verified Medical Context</text>
  </g>


  <!-- ========================================================================= -->
  <!-- 3. CROSS-CONNECTIONS: DATABASES TO RETRIEVAL ENGINES                      -->
  <!-- ========================================================================= -->
  <!-- Vector Search: Qdrant to Hybrid Search Engine -->
  <path d="M 780 383 L 730 425 L 280 425 L 280 410" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowRed)"/>
  <text x="560" y="420" font-size="10" font-weight="600" fill="#f87171">Dense Vector Search (Cosine)</text>

  <!-- Keyword Search: BM25 to Hybrid Search Engine -->
  <path d="M 980 383 L 950 440 L 260 440 L 240 415" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowEmerald)"/>
  <text x="660" y="435" font-size="10" font-weight="600" fill="#34d399">Keyword Exact Search (BM25)</text>

  <!-- Entity Traversal: Neo4j to GraphRAG Search -->
  <path d="M 1180 383 L 1150 400 L 590 400" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowPurple)"/>
  <text x="860" y="395" font-size="10" font-weight="600" fill="#c084fc">Graph Cypher Traversal</text>


  <!-- ========================================================================= -->
  <!-- 4. BOTTOM SUBGRAPH: GENERATION & STREAMING PIPELINE                       -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 840)">
    <!-- Subgraph Container -->
    <rect x="0" y="0" width="1240" height="190" rx="14" fill="#141c2e" stroke="#c084fc" stroke-width="1.5" opacity="0.95" filter="url(#boxShadow)"/>
    <text x="620" y="24" text-anchor="middle" font-size="12" font-weight="800" fill="#d8b4fe" letter-spacing="0.8">
      GENERATION &amp; STREAMING PIPELINE
    </text>

    <!-- 4.1 Prompt Assembly -->
    <rect x="40" y="45" width="260" height="50" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="170" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="#f8fafc">Prompt Assembly</text>
    <text x="170" y="85" text-anchor="middle" font-size="10" fill="#94a3b8">Context + Clinical Safety Disclaimer</text>

    <!-- Arrow to Generator -->
    <line x1="300" y1="70" x2="350" y2="70" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrowPurple)"/>

    <!-- 4.2 LLM Generator -->
    <rect x="350" y="45" width="280" height="50" rx="8" fill="#831843" stroke="#ec4899" stroke-width="2"/>
    <text x="490" y="68" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">OpenAI GPT-4o-mini Generator</text>
    <text x="490" y="85" text-anchor="middle" font-size="10" fill="#fbcfe8">stream=True · First Token ~250ms</text>

    <!-- Dotted Line: Save Cache -->
    <path d="M 490 45 L 490 15 L 80 15 L 80 -600 L 170 -600" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="260" y="10" font-size="10" font-weight="700" fill="#f87171">Async Save Query &amp; Answer into Redis Cache</text>

    <!-- Arrow to SSE Stream -->
    <line x1="630" y1="70" x2="680" y2="70" stroke="#ec4899" stroke-width="1.5" marker-end="url(#arrowPink)"/>

    <!-- 4.3 SSE Stream -->
    <rect x="680" y="45" width="240" height="50" rx="8" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
    <text x="800" y="68" text-anchor="middle" font-size="12" font-weight="800" fill="#38bdf8">Server-Sent Events (SSE)</text>
    <text x="800" y="85" text-anchor="middle" font-size="10" fill="#bae6fd">text/event-stream Chunk Delivery</text>

    <!-- Arrow to Output Client -->
    <line x1="920" y1="70" x2="970" y2="70" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowCyan)"/>

    <!-- 4.4 React 19 UI -->
    <rect x="970" y="40" width="240" height="135" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="1090" y="65" text-anchor="middle" font-size="13" font-weight="800" fill="#67e8f9">React 19 + Vite UI</text>
    <text x="1090" y="82" text-anchor="middle" font-size="10" font-weight="700" fill="#c084fc">(Designed via Stitch MCP)</text>
    <text x="1090" y="105" text-anchor="middle" font-size="10" fill="#cbd5e1">• Typewriter Token Stream</text>
    <text x="1090" y="122" text-anchor="middle" font-size="10" fill="#cbd5e1">• Telemetry Drawer &amp; Cache Badge</text>
    <text x="1090" y="140" text-anchor="middle" font-size="10" fill="#cbd5e1">• Source Inspection &amp; Speedup</text>

    <!-- Telemetry Score Banner -->
    <rect x="40" y="115" width="880" height="60" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="60" y="138" font-size="11" font-weight="700" fill="#34d399">📊 105-Query Benchmark Results:</text>
    <text x="60" y="158" font-size="10" fill="#cbd5e1">Negative Rejection: <tspan font-weight="700" fill="#34d399">92.4%</tspan> · Medical Safety: <tspan font-weight="700" fill="#34d399">84.8%</tspan> · Answer Relevance: <tspan font-weight="700" fill="#38bdf8">76.2%</tspan> · Context Relevance: <tspan font-weight="700" fill="#38bdf8">0.5078</tspan> · Cache HIT: <tspan font-weight="700" fill="#fbbf24">&lt; 10ms</tspan></text>
  </g>

  <!-- Connect Final Context to Generation Pipeline -->
  <line x1="340" y1="820" x2="340" y2="840" stroke="#34d399" stroke-width="2" marker-end="url(#arrowEmerald)"/>

</svg>