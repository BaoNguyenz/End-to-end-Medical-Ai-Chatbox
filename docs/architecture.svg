  <text x="510" y="642" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">Cross-Encoder</text>
  <text x="510" y="660" text-anchor="middle" font-size="9" fill="#78350f">ms-marco-MiniLM-L-6</text>

  <rect x="615" y="620" width="170" height="55" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="700" y="642" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">MMR Diversity</text>
  <text x="700" y="660" text-anchor="middle" font-size="9" fill="#14532d">Lambda = 0.7</text>

