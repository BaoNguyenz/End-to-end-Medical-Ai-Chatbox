  <text x="480" y="465" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">Dense (Qdrant)</text>

  <rect x="550" y="440" width="110" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="605" y="465" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">Sparse (BM25)</text>

  <rect x="675" y="440" width="110" height="40" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
