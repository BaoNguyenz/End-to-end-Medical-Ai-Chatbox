  <rect x="60" y="395" width="85" height="105" rx="12" fill="#450a0a" stroke="#ef4444" stroke-width="2" filter="url(#darkShadow)"/>
  <text x="102" y="423" text-anchor="middle" font-size="20">🔴</text>
  <text x="102" y="445" text-anchor="middle" font-size="12" font-weight="bold" fill="#fca5a5">Qdrant</text>
  <text x="102" y="465" text-anchor="middle" font-size="10" fill="#f87171">13,350 Pts</text>
  <text x="102" y="483" text-anchor="middle" font-size="10" fill="#fca5a5">MiniLM-L6</text>

  <!-- Store 2: BM25 -->
  <rect x="157" y="395" width="85" height="105" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="2" filter="url(#darkShadow)"/>
  <text x="200" y="423" text-anchor="middle" font-size="20">🟢</text>
  <text x="200" y="445" text-anchor="middle" font-size="12" font-weight="bold" fill="#6ee7b7">BM25</text>
  <text x="200" y="465" text-anchor="middle" font-size="10" fill="#34d399">Lexical Index</text>
  <text x="200" y="483" text-anchor="middle" font-size="10" fill="#6ee7b7">Exact Terms</text>

  <!-- Store 3: Neo4j -->
  <rect x="255" y="395" width="85" height="105" rx="12" fill="#581c87" stroke="#a855f7" stroke-width="2" filter="url(#darkShadow)"/>
  <text x="297" y="423" text-anchor="middle" font-size="20">🟣</text>
  <text x="297" y="445" text-anchor="middle" font-size="12" font-weight="bold" fill="#d8b4fe">Neo4j</text>
  <text x="297" y="465" text-anchor="middle" font-size="10" fill="#c084fc">GraphRAG</text>
  <text x="297" y="483" text-anchor="middle" font-size="10" fill="#d8b4fe">288 Diseases</text>

