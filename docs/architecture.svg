<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="100%" height="100%" style="background:#0f172a; font-family:'Virgil', 'Caveat', 'Segoe Print', 'Comic Sans MS', 'Segoe UI', -apple-system, sans-serif;">
  <defs>
    <!-- Sketch Arrow Markers (Vibrant for Dark Theme) -->
    <marker id="sketchArrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M1,1 L8,4 L1,7" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="sketchArrowEmerald" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M1,1 L8,4 L1,7" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="sketchArrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M1,1 L8,4 L1,7" fill="none" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="sketchArrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M1,1 L8,4 L1,7" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="sketchArrowPink" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M1,1 L8,4 L1,7" fill="none" stroke="#f472b6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    
    <!-- Dark Shadow Filter -->
    <filter id="darkShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Canvas Dark Background -->
  <rect width="1200" height="880" fill="#0f172a"/>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(60, 25)">
    <text x="540" y="35" text-anchor="middle" font-size="28" font-weight="bold" fill="#f8fafc" letter-spacing="0.5">
      🩺 GaleMed AI — Clinical GraphRAG &amp; Semantic Cache
    </text>
    <text x="540" y="65" text-anchor="middle" font-size="14" font-weight="500" fill="#94a3b8">
      The Gale Encyclopedia of Medicine (3rd Ed) · Qdrant · Neo4j · Redis Stack · CrossEncoder · SSE Stream
    </text>
    <!-- Doodle Hand-drawn Underline (Cyan Glow) -->
    <path d="M 280 75 Q 540 82 800 75" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- ==================== SECTION 1: INGESTION ==================== -->
  <!-- Container Box -->
  <rect x="40" y="115" width="320" height="725" rx="18" fill="#1e293b" stroke="#334155" stroke-width="2.5" stroke-dasharray="8,6" filter="url(#darkShadow)"/>
  <rect x="65" y="100" width="220" height="32" rx="10" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
  <text x="175" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">
    📥 1. OFFLINE DATA INGESTION
  </text>

  <!-- Encyclopedia Docs Card -->
