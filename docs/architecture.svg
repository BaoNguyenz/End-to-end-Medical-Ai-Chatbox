  <rect x="870" y="390" width="265" height="155" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#darkShadow)"/>
  <text x="1002" y="420" text-anchor="middle" font-size="14" font-weight="bold" fill="#67e8f9">React 19 + Vite UI</text>
  <text x="1002" y="440" text-anchor="middle" font-size="11" font-weight="bold" fill="#c084fc">(Designed via Stitch MCP)</text>
  <text x="1002" y="465" text-anchor="middle" font-size="11" fill="#cbd5e1">Live Typewriter Token Streaming</text>
  <text x="1002" y="488" text-anchor="middle" font-size="11" fill="#cbd5e1">Real-time Telemetry Drawer</text>
  <text x="1002" y="511" text-anchor="middle" font-size="11" font-weight="bold" fill="#34d399">⚡ Cache Hit Badge &amp; Speedup</text>
  <text x="1002" y="533" text-anchor="middle" font-size="10" fill="#94a3b8">Source Citations &amp; Inspection</text>

  <!-- Redis Cache Save Path (Curved Dotted line) -->
  <path d="M 1002 240 Q 1002 260 815 260" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="895" y="255" text-anchor="middle" font-size="9" font-weight="bold" fill="#f87171">Async Save to Cache</text>

  <!-- Sticky Note: Telemetry (Dark Emerald) -->
  <g transform="translate(870, 565)">
    <rect x="0" y="0" width="265" height="195" rx="14" fill="#022c22" stroke="#059669" stroke-width="2" filter="url(#darkShadow)"/>
    <circle cx="132" cy="12" r="5" fill="#34d399"/>
    <text x="20" y="35" font-size="13" font-weight="bold" fill="#6ee7b7">⚡ 105-Query Benchmark:</text>
    <text x="20" y="65" font-size="12" fill="#a7f3d0">• Negative Rejection: <tspan font-weight="bold" fill="#34d399">92.4%</tspan></text>
    <text x="20" y="90" font-size="12" fill="#a7f3d0">• Medical Safety: <tspan font-weight="bold" fill="#34d399">84.8%</tspan></text>
    <text x="20" y="115" font-size="12" fill="#a7f3d0">• Answer Relevance: <tspan font-weight="bold" fill="#38bdf8">76.2%</tspan></text>
    <text x="20" y="140" font-size="12" fill="#a7f3d0">• Context Relevance: <tspan font-weight="bold" fill="#38bdf8">0.5078</tspan></text>
    <text x="20" y="165" font-size="12" fill="#a7f3d0">• Cache HIT Latency: <tspan font-weight="bold" fill="#fbbf24">&lt; 10ms</tspan></text>
