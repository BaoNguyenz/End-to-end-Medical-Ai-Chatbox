  <rect x="390" y="115" width="430" height="725" rx="18" fill="#1e293b" stroke="#334155" stroke-width="2.5" stroke-dasharray="8,6" filter="url(#darkShadow)"/>
  <rect x="440" y="100" width="280" height="32" rx="10" fill="#065f46" stroke="#34d399" stroke-width="2"/>
