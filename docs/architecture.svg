  <text x="200" y="183" text-anchor="middle" font-size="14" font-weight="bold" fill="#f8fafc">Gale Medical Encyclopedia</text>
  <text x="200" y="203" text-anchor="middle" font-size="12" fill="#94a3b8">6,400+ Articles · 3rd Edition</text>

  <!-- Arrow -->
  <path d="M 200 220 Q 200 245 200 255" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#sketchArrowCyan)"/>

