<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1200" width="100%" height="100%" style="background:#13151a; font-family:'Trebuchet MS', 'Segoe UI', -apple-system, sans-serif;">
  <defs>
    <!-- Arrow Marker -->
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#8b949e"/>
    </marker>

    <!-- Cylinder Shape Gradient/Filter -->
    <linearGradient id="cylinderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e3f2fd"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1100" height="1200" fill="#13151a"/>

  <!-- ========================================================================= -->
  <!-- 1. LEFT SUBGRAPH: ONLINE RETRIEVAL PIPELINE (Real-Time)                   -->
  <!-- ========================================================================= -->
  <!-- Subgraph Outer Box (Dark Gray Transparent) -->
  <rect x="30" y="30" width="510" height="910" rx="4" fill="#2d333b" fill-opacity="0.4" stroke="#444c56" stroke-width="1.5"/>
  <text x="285" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#f0883e" letter-spacing="0.5">
    ONLINE RETRIEVAL PIPELINE (Real-Time)
  </text>

  <!-- 1.1 User Query (Orange Box) -->
  <rect x="210" y="65" width="150" height="36" rx="3" fill="#ffe0b2" stroke="#fb8c00" stroke-width="1.5"/>
  <text x="285" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">User Query</text>

  <!-- Arrow down -->
  <line x1="285" y1="101" x2="285" y2="140" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 1.2 Query Router (Yellow Diamond) -->
  <g transform="translate(285, 175)">
    <polygon points="0,-35 60,0 0,35 -60,0" fill="#fffde7" stroke="#fbc02d" stroke-width="2"/>
    <text x="0" y="4" text-anchor="middle" font-size="11" font-weight="bold" fill="#f57f17">Query Router</text>
  </g>

  <!-- Router -> Hybrid Search Path -->
  <path d="M 225 175 L 170 175 L 170 260" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Pill Label: Hybrid Search -->
  <rect x="135" y="205" width="70" height="18" rx="3" fill="#30363d"/>
  <text x="170" y="218" text-anchor="middle" font-size="9" fill="#c9d1d9">Hybrid Search</text>

  <!-- Router -> GraphRAG Path -->
  <path d="M 345 175 L 430 175 L 430 420" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Pill Label: GraphRAG -->
  <rect x="405" y="280" width="52" height="18" rx="3" fill="#30363d"/>
  <text x="431" y="293" text-anchor="middle" font-size="9" fill="#c9d1d9">GraphRAG</text>

  <!-- 1.3 Query Transformation Box -->
  <rect x="95" y="260" width="150" height="34" rx="3" fill="#fffde7" stroke="#fb8c00" stroke-width="1.5"/>
  <text x="170" y="282" text-anchor="middle" font-size="11" font-weight="bold" fill="#e65100">Query Transformation</text>

  <!-- Split lines to HyDE and Decomposer -->
  <path d="M 170 294 L 170 310 M 110 310 L 230 310 L 230 330 M 110 310 L 110 330" fill="none" stroke="#8b949e" stroke-width="1.2"/>

  <!-- HyDE Box -->
  <rect x="50" y="330" width="120" height="42" rx="3" fill="#fffde7" stroke="#fb8c00" stroke-width="1.5"/>
  <text x="110" y="348" text-anchor="middle" font-size="10" font-weight="bold" fill="#e65100">HyDE - Hypothetical</text>
  <text x="110" y="362" text-anchor="middle" font-size="10" font-weight="bold" fill="#e65100">Document</text>

  <!-- Decomposer Box -->
  <rect x="180" y="330" width="120" height="42" rx="3" fill="#fffde7" stroke="#fb8c00" stroke-width="1.5"/>
  <text x="240" y="355" text-anchor="middle" font-size="10" font-weight="bold" fill="#e65100">Decomposer - Subqueries</text>

  <!-- Merge to Hybrid Search Engine -->
  <path d="M 110 372 L 110 400 L 170 400 M 240 372 L 240 400 L 170 400 L 170 415" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 1.4 Hybrid Search Engine (Dark Pill/Box) -->
  <rect x="100" y="415" width="140" height="34" rx="3" fill="#1c2128" stroke="#444c56" stroke-width="1.5"/>
  <text x="170" y="437" text-anchor="middle" font-size="11" font-weight="bold" fill="#adbac7">Hybrid Search Engine</text>

  <!-- 1.5 GraphRAG Search (Green Box) -->
  <rect x="375" y="420" width="110" height="34" rx="3" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="430" y="442" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">GraphRAG Search</text>

  <!-- Arrow down from Hybrid Engine to RRF -->
  <path d="M 170 449 L 170 560 L 95 560 L 95 575" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 1.6 RRF Fusion (Green Box) -->
  <rect x="50" y="575" width="90" height="34" rx="3" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="95" y="597" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">RRF Fusion</text>

  <!-- RRF -> Merge Candidates -->
  <path d="M 95 609 L 95 655 L 205 655" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Pill Label: Top 50 Chunks -->
  <rect x="60" y="625" width="70" height="18" rx="3" fill="#30363d"/>
  <text x="95" y="638" text-anchor="middle" font-size="9" fill="#c9d1d9">Top 50 Chunks</text>

  <!-- GraphRAG -> Merge Candidates -->
  <path d="M 430 454 L 430 655 L 345 655" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Pill Label: Top 10 Results -->
  <rect x="395" y="590" width="65" height="18" rx="3" fill="#30363d"/>
  <text x="427" y="603" text-anchor="middle" font-size="9" fill="#c9d1d9">Top 10 Results</text>

  <!-- 1.7 Merge Candidates (Green Box) -->
  <rect x="210" y="640" width="130" height="34" rx="3" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="275" y="662" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">Merge Candidates</text>

  <!-- Merge -> Cross-Encoder -->
  <line x1="275" y1="674" x2="275" y2="725" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Pill Label: 60 Chunks -->
  <rect x="250" y="690" width="50" height="18" rx="3" fill="#30363d"/>
  <text x="275" y="703" text-anchor="middle" font-size="9" fill="#c9d1d9">60 Chunks</text>

  <!-- 1.8 Cross-Encoder Reranker -->
  <rect x="195" y="725" width="160" height="34" rx="3" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="275" y="747" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">Cross-Encoder Reranker</text>

  <!-- Cross-Encoder -> MMR -->
  <line x1="275" y1="759" x2="275" y2="810" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Pill Label: Top 20 Chunks -->
  <rect x="240" y="775" width="70" height="18" rx="3" fill="#30363d"/>
  <text x="275" y="788" text-anchor="middle" font-size="9" fill="#c9d1d9">Top 20 Chunks</text>

  <!-- 1.9 MMR Diversity Filter -->
  <rect x="200" y="810" width="150" height="34" rx="3" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="275" y="832" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">MMR Diversity Filter</text>

  <!-- MMR -> Final Context -->
  <line x1="275" y1="844" x2="275" y2="885" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Pill Label: Top 10 Chunks -->
  <rect x="240" y="855" width="70" height="18" rx="3" fill="#30363d"/>
  <text x="275" y="868" text-anchor="middle" font-size="9" fill="#c9d1d9">Top 10 Chunks</text>

  <!-- 1.10 Final Context (Dark Box) -->
  <rect x="215" y="885" width="120" height="34" rx="3" fill="#1c2128" stroke="#444c56" stroke-width="1.5"/>
  <text x="275" y="907" text-anchor="middle" font-size="11" font-weight="bold" fill="#adbac7">Final Context</text>


  <!-- ========================================================================= -->
  <!-- 2. RIGHT SUBGRAPH: OFFLINE DATA INGESTION PIPELINE                        -->
  <!-- ========================================================================= -->
  <rect x="560" y="240" width="510" height="310" rx="4" fill="#2d333b" fill-opacity="0.4" stroke="#444c56" stroke-width="1.5"/>
  <text x="815" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#adbac7" letter-spacing="0.5">
    OFFLINE DATA INGESTION PIPELINE
  </text>

  <!-- 2.1 Technical Docs (Dark Box) -->
  <rect x="750" y="275" width="130" height="34" rx="3" fill="#1c2128" stroke="#444c56" stroke-width="1.5"/>
  <text x="815" y="297" text-anchor="middle" font-size="11" font-weight="bold" fill="#adbac7">Technical Docs</text>

  <!-- Arrow down -->
  <line x1="815" y1="309" x2="815" y2="340" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 2.2 Semantic Chunking (Green Box) -->
  <rect x="740" y="340" width="150" height="34" rx="3" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="815" y="362" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">Semantic Chunking</text>

  <!-- Split lines to Ingestion Steps -->
  <path d="M 815 374 L 815 390 M 645 390 L 985 390 L 985 410 M 645 390 L 645 410 M 815 390 L 815 410" fill="none" stroke="#8b949e" stroke-width="1.2"/>

  <!-- Text Embeddings -->
  <rect x="585" y="410" width="120" height="34" rx="3" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="645" y="432" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">Text Embeddings</text>

  <!-- BM25 Indexing -->
  <rect x="755" y="410" width="120" height="34" rx="3" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="815" y="432" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">BM25 Indexing</text>

  <!-- LLM Entity-Relation Extract -->
  <rect x="915" y="410" width="140" height="34" rx="3" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="985" y="432" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b5e20">LLM Entity-Relation Extract</text>

  <!-- Arrows to DB Cylinders -->
  <line x1="645" y1="444" x2="645" y2="485" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="815" y1="444" x2="815" y2="485" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="985" y1="444" x2="985" y2="485" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 2.3 CYLINDER DATABASES (Exact 3D Cylinder Shape) -->
  <!-- Cylinder 1: Qdrant -->
  <g transform="translate(595, 485)">
    <path d="M 0 10 A 50 10 0 0 0 100 10 L 100 40 A 50 10 0 0 1 0 40 Z" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
    <ellipse cx="50" cy="10" rx="50" ry="10" fill="#bbdefb" stroke="#1e88e5" stroke-width="1.5"/>
    <text x="50" y="32" text-anchor="middle" font-size="10" font-weight="bold" fill="#0d47a1">Qdrant Vector DB</text>
  </g>

  <!-- Cylinder 2: BM25 -->
  <g transform="translate(765, 485)">
    <path d="M 0 10 A 50 10 0 0 0 100 10 L 100 40 A 50 10 0 0 1 0 40 Z" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
    <ellipse cx="50" cy="10" rx="50" ry="10" fill="#bbdefb" stroke="#1e88e5" stroke-width="1.5"/>
    <text x="50" y="32" text-anchor="middle" font-size="10" font-weight="bold" fill="#0d47a1">BM25 Retriever</text>
  </g>

  <!-- Cylinder 3: Neo4j -->
  <g transform="translate(935, 485)">
    <path d="M 0 10 A 50 10 0 0 0 100 10 L 100 40 A 50 10 0 0 1 0 40 Z" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
    <ellipse cx="50" cy="10" rx="50" ry="10" fill="#bbdefb" stroke="#1e88e5" stroke-width="1.5"/>
    <text x="50" y="32" text-anchor="middle" font-size="10" font-weight="bold" fill="#0d47a1">Neo4j Graph DB</text>
  </g>


  <!-- ========================================================================= -->
  <!-- 3. CROSS-CONNECTIONS (EXACT LINES & PILLS FROM SCREENSHOT)               -->
  <!-- ========================================================================= -->
  <!-- Vector Search: Hybrid Engine -> Qdrant DB -->
  <path d="M 140 449 L 140 480 L 620 495" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Pill Label: Vector Search -->
  <rect x="270" y="475" width="70" height="18" rx="3" fill="#30363d"/>
  <text x="305" y="488" text-anchor="middle" font-size="9" fill="#c9d1d9">Vector Search</text>

  <!-- Keyword Search: Hybrid Engine -> BM25 DB -->
  <path d="M 210 449 L 210 495 L 780 505" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Pill Label: Keyword Search -->
  <rect x="445" y="475" width="75" height="18" rx="3" fill="#30363d"/>
  <text x="482" y="488" text-anchor="middle" font-size="9" fill="#c9d1d9">Keyword Search</text>

  <!-- Entity Linking: GraphRAG Search -> Neo4j DB -->
  <path d="M 430 454 L 430 465 L 940 495" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Pill Label: Entity Linking -->
  <rect x="415" y="460" width="70" height="18" rx="3" fill="#30363d"/>
  <text x="450" y="473" text-anchor="middle" font-size="9" fill="#c9d1d9">Entity Linking</text>

  <!-- VecDB & BM25DB -> RRF Fusion -->
  <path d="M 645 530 L 645 565 L 145 580" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 815 530 L 815 560 L 145 585" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>


  <!-- ========================================================================= -->
  <!-- 4. BOTTOM SUBGRAPH: GENERATION PIPELINE                                  -->
  <!-- ========================================================================= -->
  <rect x="200" y="970" width="150" height="200" rx="4" fill="#2d333b" fill-opacity="0.4" stroke="#444c56" stroke-width="1.5"/>
  <text x="275" y="990" text-anchor="middle" font-size="11" font-weight="bold" fill="#adbac7" letter-spacing="0.5">
    GENERATION PIPELINE
  </text>

  <!-- Line from Final Context to Prompt Assembly -->
  <line x1="275" y1="919" x2="275" y2="1005" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 4.1 Prompt Assembly (Green Box) -->
  <rect x="215" y="1005" width="120" height="34" rx="3" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="275" y="1027" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">Prompt Assembly</text>

  <!-- Line to GPT-4o -->
  <line x1="275" y1="1039" x2="275" y2="1065" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 4.2 GPT-4o Generator (Purple Box) -->
  <rect x="215" y="1065" width="120" height="34" rx="3" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.5"/>
  <text x="275" y="1087" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a148c">GPT-4o Generator</text>

  <!-- Line to Answer Output -->
  <line x1="275" y1="1099" x2="275" y2="1125" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 4.3 Answer Output (Pink Stadium/Pill) -->
  <rect x="220" y="1125" width="110" height="30" rx="15" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.5"/>
  <text x="275" y="1144" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a148c">Answer Output</text>

</svg>