<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="100%" height="100%" style="background:#ffffff; font-family:'Virgil', 'Caveat', 'Segoe Print', 'Comic Sans MS', 'Segoe UI', -apple-system, sans-serif;">
  <defs>
    <!-- Sketch Arrow Markers -->
    <marker id="sketchArrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M1,1 L8,4 L1,7" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="sketchArrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M1,1 L8,4 L1,7" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="sketchArrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M1,1 L8,4 L1,7" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="sketchArrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M1,1 L8,4 L1,7" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="sketchArrowRed" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M1,1 L8,4 L1,7" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    
    <!-- Subtle Drop Shadow for sticky notes -->
    <filter id="sketchShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="3" dy="4" stdDeviation="2" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="880" fill="#fcfcfb"/>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(60, 25)">
    <text x="540" y="35" text-anchor="middle" font-size="28" font-weight="bold" fill="#1e293b" letter-spacing="0.5">
      🩺 GaleMed AI — Clinical GraphRAG &amp; Semantic Cache
    </text>
    <text x="540" y="65" text-anchor="middle" font-size="14" font-weight="500" fill="#64748b">
      The Gale Encyclopedia of Medicine (3rd Ed) · Qdrant · Neo4j · Redis Stack · CrossEncoder · SSE Stream
    </text>
    <!-- Doodle Hand-drawn Underline -->
    <path d="M 280 75 Q 540 82 800 75" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- ==================== SECTION 1: INGESTION ==================== -->
  <!-- Container Box -->
  <rect x="40" y="115" width="320" height="725" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="8,6" filter="url(#sketchShadow)"/>
  <rect x="65" y="100" width="220" height="32" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="175" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#0369a1">
    📥 1. OFFLINE DATA INGESTION
  </text>

  <!-- Encyclopedia Docs Card -->
