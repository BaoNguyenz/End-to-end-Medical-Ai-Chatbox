  <rect x="870" y="390" width="265" height="155" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="url(#sketchShadow)"/>
  <text x="1002" y="420" text-anchor="middle" font-size="14" font-weight="bold" fill="#0284c7">React 19 + Vite UI</text>
  <text x="1002" y="440" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c3aed">(Designed via Stitch MCP)</text>
  <text x="1002" y="465" text-anchor="middle" font-size="11" fill="#334155">Live Typewriter Token Streaming</text>
  <text x="1002" y="488" text-anchor="middle" font-size="11" fill="#334155">Real-time Telemetry Drawer</text>
  <text x="1002" y="511" text-anchor="middle" font-size="11" font-weight="bold" fill="#16a34a">⚡ Cache Hit Badge &amp; Speedup</text>
  <text x="1002" y="533" text-anchor="middle" font-size="10" fill="#64748b">Source Citations &amp; Inspection</text>

  <!-- Redis Cache Save Path (Curved Dotted line) -->
  <path d="M 1002 240 Q 1002 260 815 260" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="895" y="255" text-anchor="middle" font-size="9" font-weight="bold" fill="#dc2626">Async Save to Cache</text>

  <!-- Sticky Note: Telemetry -->
  <g transform="translate(870, 565)">
    <rect x="0" y="0" width="265" height="195" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#sketchShadow)"/>
    <circle cx="132" cy="12" r="5" fill="#10b981"/>
    <text x="20" y="35" font-size="13" font-weight="bold" fill="#065f46">⚡ 105-Query Benchmark:</text>
    <text x="20" y="65" font-size="12" fill="#047857">• Negative Rejection: <tspan font-weight="bold" fill="#059669">92.4%</tspan></text>
    <text x="20" y="90" font-size="12" fill="#047857">• Medical Safety: <tspan font-weight="bold" fill="#059669">84.8%</tspan></text>
    <text x="20" y="115" font-size="12" fill="#047857">• Answer Relevance: <tspan font-weight="bold" fill="#0284c7">76.2%</tspan></text>
    <text x="20" y="140" font-size="12" fill="#047857">• Context Relevance: <tspan font-weight="bold" fill="#0284c7">0.5078</tspan></text>
    <text x="20" y="165" font-size="12" fill="#047857">• Cache HIT Latency: <tspan font-weight="bold" fill="#b45309">&lt; 10ms</tspan></text>
  </g>

