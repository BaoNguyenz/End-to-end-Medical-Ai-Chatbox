  <rect x="65" y="260" width="270" height="65" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#sketchShadow)"/>
  <text x="200" y="288" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">Semantic Section Chunking</text>
  <text x="200" y="308" text-anchor="middle" font-size="12" fill="#475569">Preserve Medical Context Boundaries</text>

  <!-- Split Branch Lines -->
  <path d="M 200 325 L 200 360 M 110 360 L 290 360 L 290 395 M 110 360 L 110 395 M 200 360 L 200 395" fill="none" stroke="#64748b" stroke-width="2"/>

