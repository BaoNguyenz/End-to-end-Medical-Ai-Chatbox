  <rect x="60" y="395" width="85" height="105" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#sketchShadow)"/>
  <text x="102" y="423" text-anchor="middle" font-size="20">🔴</text>
  <text x="102" y="445" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">Qdrant</text>
  <text x="102" y="465" text-anchor="middle" font-size="10" fill="#7f1d1d">13,350 Pts</text>
  <text x="102" y="483" text-anchor="middle" font-size="10" fill="#991b1b">MiniLM-L6</text>

  <!-- Store 2: BM25 -->
  <rect x="157" y="395" width="85" height="105" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#sketchShadow)"/>
  <text x="200" y="423" text-anchor="middle" font-size="20">🟢</text>
  <text x="200" y="445" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">BM25</text>
  <text x="200" y="465" text-anchor="middle" font-size="10" fill="#14532d">Lexical Index</text>
  <text x="200" y="483" text-anchor="middle" font-size="10" fill="#166534">Exact Terms</text>

  <!-- Store 3: Neo4j -->
  <rect x="255" y="395" width="85" height="105" rx="12" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2" filter="url(#sketchShadow)"/>
  <text x="297" y="423" text-anchor="middle" font-size="20">🟣</text>
  <text x="297" y="445" text-anchor="middle" font-size="12" font-weight="bold" fill="#581c87">Neo4j</text>
  <text x="297" y="465" text-anchor="middle" font-size="10" fill="#4c1d95">GraphRAG</text>
  <text x="297" y="483" text-anchor="middle" font-size="10" fill="#581c87">288 Diseases</text>

