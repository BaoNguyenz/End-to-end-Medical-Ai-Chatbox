  <text x="200" y="183" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Gale Medical Encyclopedia</text>
  <text x="200" y="203" text-anchor="middle" font-size="12" fill="#64748b">6,400+ Articles · 3rd Edition</text>

  <!-- Arrow -->
  <path d="M 200 220 Q 200 245 200 255" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#sketchArrowBlue)"/>

