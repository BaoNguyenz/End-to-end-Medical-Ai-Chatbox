<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1340" width="100%" height="100%" style="background:#13151a; font-family:'Trebuchet MS', 'Segoe UI', -apple-system, sans-serif;">
  <defs>
    <!-- Arrow Marker Standard -->
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#8b949e"/>
    </marker>
    <!-- Arrow Marker Emerald (Fast Hit) -->
    <marker id="arrowGreen" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#16a34a"/>
    </marker>
    <!-- Arrow Marker Red (Cache Save) -->
    <marker id="arrowRed" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1340" fill="#13151a"/>

  <!-- ========================================================================= -->
  <!-- 1. LEFT SUBGRAPH: ONLINE RETRIEVAL PIPELINE (Real-Time)                   -->
  <!-- ========================================================================= -->
  <rect x="30" y="30" width="550" height="1000" rx="4" fill="#2d333b" fill-opacity="0.4" stroke="#444c56" stroke-width="1.5"/>
  <text x="305" y="52" text-anchor="middle" font-size="12" fill="#f0883e" letter-spacing="0.5">
    ONLINE RETRIEVAL PIPELINE (Real-Time)
  </text>

  <!-- 1.1 User Query (Orange Box) -->
  <rect x="230" y="65" width="150" height="36" rx="3" fill="#ffe0b2" stroke="#fb8c00" stroke-width="1.5"/>
  <text x="305" y="88" text-anchor="middle" font-size="12" fill="#e65100">User Query</text>

  <!-- Arrow down to Redis Cache -->
  <line x1="305" y1="101" x2="305" y2="130" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 1.2 REDIS SEMANTIC CACHE (Cylinder) -->
  <g transform="translate(230, 130)">
    <path d="M 0 8 A 75 8 0 0 0 150 8 L 150 36 A 75 8 0 0 1 0 36 Z" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <ellipse cx="75" cy="8" rx="75" ry="8" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
    <text x="75" y="27" text-anchor="middle" font-size="11" fill="#991b1b">⚡ Redis Semantic Cache</text>
  </g>

  <!-- Redis -> Cache HIT Box (Green Box on left) -->
  <path d="M 230 150 C 130 150, 100 160, 100 180" fill="none" stroke="#16a34a" stroke-width="1.0" marker-end="url(#arrowGreen)"/>
  
  <!-- HỘP CACHE HIT -->
  <rect x="35" y="180" width="130" height="34" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.0"/>
  <text x="100" y="201" text-anchor="middle" font-size="11" fill="#14532d">⚡ Cache HIT (&lt;10ms)</text>

  <!-- Cache HIT Box -> Answer Output (Thin green curve down to Answer Output) -->
  <path d="M 100 214 C 100 700, 50 1100, 235 1250" fill="none" stroke="#16a34a" stroke-width="1.0" stroke-dasharray="5,4" marker-end="url(#arrowGreen)"/>

  <!-- Arrow down to Query Router (Cache MISS) -->
  <line x1="305" y1="166" x2="305" y2="200" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="270" y="174" width="70" height="16" rx="3" fill="#30363d"/>
  <text x="305" y="185" text-anchor="middle" font-size="8" fill="#c9d1d9">Cache MISS</text>

  <!-- 1.3 Query Router (Yellow Diamond) -->
  <g transform="translate(305, 235)">
    <polygon points="0,-35 60,0 0,35 -60,0" fill="#fffde7" stroke="#fbc02d" stroke-width="2"/>
    <text x="0" y="4" text-anchor="middle" font-size="11" fill="#f57f17">Query Router</text>
  </g>

  <!-- Router -> Hybrid Search Smooth Spline -->
  <path d="M 245 235 C 190 235, 190 270, 190 310" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="155" y="260" width="70" height="18" rx="3" fill="#30363d"/>
  <text x="190" y="273" text-anchor="middle" font-size="9" fill="#c9d1d9">Hybrid Search</text>

  <!-- Router -> GraphRAG Smooth Spline -->
  <path d="M 365 235 C 440 235, 440 350, 440 470" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="415" y="340" width="52" height="18" rx="3" fill="#30363d"/>
  <text x="441" y="353" text-anchor="middle" font-size="9" fill="#c9d1d9">GraphRAG</text>

  <!-- 1.4 Query Transformation Box -->
  <rect x="115" y="310" width="150" height="34" rx="3" fill="#fffde7" stroke="#fb8c00" stroke-width="1.5"/>
  <text x="190" y="332" text-anchor="middle" font-size="11" fill="#e65100">Query Transformation</text>

  <!-- Split curves to HyDE and Decomposer -->
  <path d="M 190 344 C 190 360, 130 360, 130 380" fill="none" stroke="#8b949e" stroke-width="1.2"/>
  <path d="M 190 344 C 190 360, 260 360, 260 380" fill="none" stroke="#8b949e" stroke-width="1.2"/>

  <!-- HyDE Box -->
  <rect x="70" y="380" width="120" height="42" rx="3" fill="#fffde7" stroke="#fb8c00" stroke-width="1.5"/>
  <text x="130" y="398" text-anchor="middle" font-size="10" fill="#e65100">HyDE Document</text>

  <!-- Decomposer Box -->
  <rect x="200" y="380" width="130" height="42" rx="3" fill="#fffde7" stroke="#fb8c00" stroke-width="1.5"/>
  <text x="265" y="405" text-anchor="middle" font-size="10" fill="#e65100">Decomposer Subqueries</text>

  <!-- Merge curves to Hybrid Search Engine -->
  <path d="M 130 422 C 130 445, 190 445, 190 465" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 265 422 C 265 445, 190 445, 190 465" fill="none" stroke="#8b949e" stroke-width="1.2"/>

  <!-- 1.5 Hybrid Search Engine -->
  <rect x="120" y="465" width="140" height="34" rx="3" fill="#1c2128" stroke="#444c56" stroke-width="1.5"/>
  <text x="190" y="487" text-anchor="middle" font-size="11" fill="#adbac7">Hybrid Search Engine</text>

  <!-- 1.6 GraphRAG Search (Green Box) -->
  <rect x="375" y="470" width="130" height="34" rx="3" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="440" y="492" text-anchor="middle" font-size="11" fill="#1b5e20">GraphRAG Search</text>

  <!-- 1.7 RRF Fusion (Green Box - ĐƯỢC NẠP DỮ LIỆU TỪ 2 DATABASE) -->
  <rect x="70" y="645" width="90" height="34" rx="3" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="115" y="667" text-anchor="middle" font-size="11" fill="#1b5e20">RRF Fusion</text>

  <!-- RRF -> Merge Candidates Smooth Curve -->
  <path d="M 115 679 C 115 725, 230 725, 230 740" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="85" y="700" width="70" height="18" rx="3" fill="#30363d"/>
  <text x="120" y="713" text-anchor="middle" font-size="9" fill="#c9d1d9">Top 50 Chunks</text>

  <!-- 1.8 Merge Candidates (Green Box) -->
  <rect x="230" y="725" width="130" height="34" rx="3" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="295" y="747" text-anchor="middle" font-size="11" fill="#1b5e20">Merge Candidates</text>

  <!-- Merge -> Cross-Encoder -->
  <line x1="295" y1="759" x2="295" y2="805" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="270" y="775" width="50" height="18" rx="3" fill="#30363d"/>
  <text x="295" y="788" text-anchor="middle" font-size="9" fill="#c9d1d9">60 Chunks</text>

  <!-- 1.9 Cross-Encoder Reranker -->
  <rect x="215" y="805" width="160" height="34" rx="3" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="295" y="827" text-anchor="middle" font-size="11" fill="#1b5e20">Cross-Encoder Reranker</text>

  <!-- Cross-Encoder -> MMR -->
  <line x1="295" y1="839" x2="295" y2="885" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="260" y="855" width="70" height="18" rx="3" fill="#30363d"/>
  <text x="295" y="868" text-anchor="middle" font-size="9" fill="#c9d1d9">Top 20 Chunks</text>

  <!-- 1.10 MMR Diversity Filter -->
  <rect x="220" y="885" width="150" height="34" rx="3" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="295" y="907" text-anchor="middle" font-size="11" fill="#1b5e20">MMR Diversity Filter</text>

  <!-- MMR -> Final Context -->
  <line x1="295" y1="919" x2="295" y2="960" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="260" y="930" width="70" height="18" rx="3" fill="#30363d"/>
  <text x="295" y="943" text-anchor="middle" font-size="9" fill="#c9d1d9">Top 10 Chunks</text>

  <!-- 1.11 Final Context (Dark Box) -->
  <rect x="235" y="960" width="120" height="34" rx="3" fill="#1c2128" stroke="#444c56" stroke-width="1.5"/>
  <text x="295" y="982" text-anchor="middle" font-size="11" fill="#adbac7">Final Context</text>


  <!-- ========================================================================= -->
  <!-- 2. RIGHT SUBGRAPH: OFFLINE DATA INGESTION PIPELINE                        -->
  <!-- ========================================================================= -->
  <rect x="610" y="290" width="530" height="320" rx="4" fill="#2d333b" fill-opacity="0.4" stroke="#444c56" stroke-width="1.5"/>
  <text x="875" y="312" text-anchor="middle" font-size="12" fill="#adbac7" letter-spacing="0.5">
    OFFLINE DATA INGESTION PIPELINE
  </text>

  <!-- 2.1 Technical Docs (Dark Box) -->
  <rect x="810" y="325" width="130" height="34" rx="3" fill="#1c2128" stroke="#444c56" stroke-width="1.5"/>
  <text x="875" y="347" text-anchor="middle" font-size="11" fill="#adbac7">Gale Medical Docs</text>

  <!-- Arrow down -->
  <line x1="875" y1="359" x2="875" y2="390" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 2.2 Semantic Chunking (Green Box) -->
  <rect x="800" y="390" width="150" height="34" rx="3" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="875" y="412" text-anchor="middle" font-size="11" fill="#1b5e20">Semantic Chunking</text>

  <!-- Split smooth curves to Ingestion Steps -->
  <path d="M 875 424 C 875 440, 695 440, 695 460" fill="none" stroke="#8b949e" stroke-width="1.2"/>
  <path d="M 875 424 L 875 460" fill="none" stroke="#8b949e" stroke-width="1.2"/>
  <path d="M 875 424 C 875 440, 1055 440, 1055 460" fill="none" stroke="#8b949e" stroke-width="1.2"/>

  <!-- Text Embeddings -->
  <rect x="635" y="460" width="120" height="34" rx="3" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="695" y="482" text-anchor="middle" font-size="11" fill="#1b5e20">Text Embeddings</text>

  <!-- BM25 Indexing -->
  <rect x="815" y="460" width="120" height="34" rx="3" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="875" y="482" text-anchor="middle" font-size="11" fill="#1b5e20">BM25 Indexing</text>

  <!-- LLM Entity-Relation Extract -->
  <rect x="985" y="460" width="140" height="34" rx="3" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="1055" y="482" text-anchor="middle" font-size="10" fill="#1b5e20">LLM Entity Extract</text>

  <!-- Arrows to DB Cylinders -->
  <line x1="695" y1="494" x2="695" y2="535" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="875" y1="494" x2="875" y2="535" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="1055" y1="494" x2="1055" y2="535" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 2.3 CYLINDER DATABASES -->
  <!-- Cylinder 1: Qdrant -->
  <g transform="translate(645, 535)">
    <path d="M 0 10 A 50 10 0 0 0 100 10 L 100 40 A 50 10 0 0 1 0 40 Z" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
    <ellipse cx="50" cy="10" rx="50" ry="10" fill="#bbdefb" stroke="#1e88e5" stroke-width="1.5"/>
    <text x="50" y="32" text-anchor="middle" font-size="10" fill="#0d47a1">Qdrant Vector DB</text>
  </g>

  <!-- Cylinder 2: BM25 -->
  <g transform="translate(825, 535)">
    <path d="M 0 10 A 50 10 0 0 0 100 10 L 100 40 A 50 10 0 0 1 0 40 Z" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
    <ellipse cx="50" cy="10" rx="50" ry="10" fill="#bbdefb" stroke="#1e88e5" stroke-width="1.5"/>
    <text x="50" y="32" text-anchor="middle" font-size="10" fill="#0d47a1">BM25 Retriever</text>
  </g>

  <!-- Cylinder 3: Neo4j -->
  <g transform="translate(1005, 535)">
    <path d="M 0 10 A 50 10 0 0 0 100 10 L 100 40 A 50 10 0 0 1 0 40 Z" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
    <ellipse cx="50" cy="10" rx="50" ry="10" fill="#bbdefb" stroke="#1e88e5" stroke-width="1.5"/>
    <text x="50" y="32" text-anchor="middle" font-size="10" fill="#0d47a1">Neo4j Graph DB</text>
  </g>


  <!-- ========================================================================= -->
  <!-- 3. REQUEST & RESPONSE LANES (NO DIRECT ENGINE->RRF LINE!)                -->
  <!-- ========================================================================= -->
  <!-- REQUEST 1: Vector Search (Hybrid Engine -> Qdrant DB) -->
  <path d="M 260 480 C 450 480, 550 540, 645 545" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="290" y="485" width="70" height="18" rx="3" fill="#30363d"/>
  <text x="325" y="498" text-anchor="middle" font-size="9" fill="#c9d1d9">Vector Search</text>

  <!-- REQUEST 2: Keyword Search (Hybrid Engine -> BM25 DB) -->
  <path d="M 260 490 C 480 490, 650 540, 825 545" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="480" y="490" width="75" height="18" rx="3" fill="#30363d"/>
  <text x="517" y="503" text-anchor="middle" font-size="9" fill="#c9d1d9">Keyword Search</text>

  <!-- REQUEST 3: Entity Linking (GraphRAG Search -> Neo4j DB) -->
  <path d="M 505 487 C 650 487, 850 535, 1005 545" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="425" y="445" width="70" height="18" rx="3" fill="#30363d"/>
  <text x="460" y="458" text-anchor="middle" font-size="9" fill="#c9d1d9">Entity Linking</text>

  <!-- RESPONSE 1: Qdrant DB -> RRF Fusion (Low Lane: sweeps cleanly below) -->
  <path d="M 695 580 C 695 640, 250 620, 165 650" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- RESPONSE 2: BM25 DB -> RRF Fusion (Low Lane: sweeps cleanly below) -->
  <path d="M 875 580 C 875 645, 270 630, 165 655" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- RESPONSE 3: Neo4j Graph DB -> Merge Candidates (Clear sweeping path) -->
  <path d="M 1055 580 C 1055 700, 500 710, 365 735" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="450" y="660" width="65" height="18" rx="3" fill="#30363d"/>
  <text x="482" y="673" text-anchor="middle" font-size="9" fill="#c9d1d9">Top 10 Results</text>


  <!-- ========================================================================= -->
  <!-- 4. BOTTOM SUBGRAPH: GENERATION PIPELINE                                  -->
  <!-- ========================================================================= -->
  <rect x="200" y="1060" width="190" height="225" rx="4" fill="#2d333b" fill-opacity="0.4" stroke="#444c56" stroke-width="1.5"/>
  <text x="295" y="1080" text-anchor="middle" font-size="11" fill="#adbac7" letter-spacing="0.5">
    GENERATION PIPELINE
  </text>

  <!-- Line from Final Context to Prompt Assembly -->
  <line x1="295" y1="994" x2="295" y2="1095" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 4.1 Prompt Assembly (Green Box) -->
  <rect x="235" y="1095" width="120" height="34" rx="3" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="295" y="1117" text-anchor="middle" font-size="11" fill="#1b5e20">Prompt Assembly</text>

  <!-- Line to GPT-4o -->
  <line x1="295" y1="1129" x2="295" y2="1155" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 4.2 GPT-4o Generator (Purple Box) -->
  <rect x="235" y="1155" width="120" height="34" rx="3" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.5"/>
  <text x="295" y="1177" text-anchor="middle" font-size="11" fill="#4a148c">GPT-4o Generator</text>

  <!-- GPT-4o -> HỘP ASYNC CACHE SAVE -->
  <path d="M 355 1172 L 440 1172" fill="none" stroke="#ef4444" stroke-width="1.0" stroke-dasharray="4,4" marker-end="url(#arrowRed)"/>

  <!-- HỘP ASYNC CACHE SAVE -->
  <rect x="440" y="1157" width="120" height="30" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.0" stroke-dasharray="4,4"/>
  <text x="500" y="1176" text-anchor="middle" font-size="10" fill="#991b1b">Async Cache Save</text>

  <!-- Hộp Async Cache Save -> chạy vòng lên Redis Semantic Cache (Mỏng 1.0px) -->
  <path d="M 560 1172 L 1160 1172 L 1160 148 L 380 148" fill="none" stroke="#ef4444" stroke-width="1.0" stroke-dasharray="4,4" marker-end="url(#arrowRed)"/>

  <!-- Line from GPT-4o to Answer Output -->
  <line x1="295" y1="1189" x2="295" y2="1230" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 4.3 Answer Output (Pink Stadium/Pill with SSE label) -->
  <rect x="225" y="1230" width="140" height="34" rx="17" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.5"/>
  <text x="295" y="1251" text-anchor="middle" font-size="10" fill="#4a148c">Answer Output - SSE</text>

</svg>