  <text x="200" y="288" text-anchor="middle" font-size="14" font-weight="bold" fill="#c7d2fe">Semantic Section Chunking</text>
  <text x="200" y="308" text-anchor="middle" font-size="12" fill="#94a3b8">Preserve Medical Context Boundaries</text>

  <!-- Split Branch Lines -->
  <path d="M 200 325 L 200 360 M 110 360 L 290 360 L 290 395 M 110 360 L 110 395 M 200 360 L 200 395" fill="none" stroke="#64748b" stroke-width="2"/>

