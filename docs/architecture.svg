<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1280" width="100%" height="100%" style="background:#13151a; font-family:'Trebuchet MS', 'Segoe UI', -apple-system, sans-serif;">
  <defs>
    <!-- Arrow Marker Standard Gray (Smooth Mermaid style) -->
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#8b949e"/>
    </marker>
    <!-- Arrow Marker Emerald -->
    <marker id="arrowGreen" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#34d399"/>
    </marker>
    <!-- Arrow Marker Red -->
    <marker id="arrowRed" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#f87171"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1160" height="1280" fill="#13151a"/>

  <!-- ========================================================================= -->
  <!-- 1. LEFT SUBGRAPH: ONLINE RETRIEVAL PIPELINE (Real-Time)                   -->
  <!-- ========================================================================= -->
  <rect x="30" y="30" width="550" height="970" rx="4" fill="#2d333b" fill-opacity="0.4" stroke="#444c56" stroke-width="1.5"/>
  <text x="305" y="52" text-anchor="middle" font-size="12" font-weight="normal" fill="#f0883e" letter-spacing="0.5">
    ONLINE RETRIEVAL PIPELINE (Real-Time)
  </text>

  <!-- 1.1 User Query (Orange Box) -->
  <rect x="230" y="65" width="150" height="36" rx="3" fill="#ffe0b2" stroke="#fb8c00" stroke-width="1.5"/>
  <text x="305" y="88" text-anchor="middle" font-size="12" font-weight="normal" fill="#e65100">User Query</text>

  <!-- Smooth Arrow down to Redis Cache -->
  <path d="M 305 101 L 305 130" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 1.2 REDIS SEMANTIC CACHE (Cylinder) -->
  <g transform="translate(230, 130)">
    <path d="M 0 8 A 75 8 0 0 0 150 8 L 150 36 A 75 8 0 0 1 0 36 Z" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <ellipse cx="75" cy="8" rx="75" ry="8" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
    <text x="75" y="27" text-anchor="middle" font-size="11" font-weight="normal" fill="#991b1b">⚡ Redis Semantic Cache</text>
  </g>

  <!-- FAST TRACK: Cache HIT -> Smooth gentle curve directly down to Answer Output -->
  <path d="M 230 150 C 50 150, 50 700, 50 1205 L 235 1205" fill="none" stroke="#34d399" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrowGreen)"/>
  <!-- Pill Label: Cache HIT (< 10ms) -->
  <rect x="18" y="470" width="80" height="28" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="58" y="484" text-anchor="middle" font-size="9" font-weight="normal" fill="#34d399">⚡ Cache HIT</text>
  <text x="58" y="495" text-anchor="middle" font-size="8" fill="#a7f3d0">&lt; 10ms (RAM)</text>

  <!-- Smooth Arrow down to Query Router (Cache MISS) -->
  <path d="M 305 166 L 305 200" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="270" y="174" width="70" height="16" rx="3" fill="#30363d"/>
  <text x="305" y="185" text-anchor="middle" font-size="8" fill="#c9d1d9">Cache MISS</text>

  <!-- 1.3 Query Router (Yellow Diamond) -->
  <g transform="translate(305, 235)">
    <polygon points="0,-35 60,0 0,35 -60,0" fill="#fffde7" stroke="#fbc02d" stroke-width="2"/>
    <text x="0" y="4" text-anchor="middle" font-size="11" font-weight="normal" fill="#f57f17">Query Router</text>
  </g>

  <!-- Router -> Hybrid Search Smooth Spline -->
  <path d="M 245 235 C 190 235, 190 270, 190 310" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Pill Label: Hybrid Search -->
  <rect x="155" y="260" width="70" height="18" rx="3" fill="#30363d"/>
  <text x="190" y="273" text-anchor="middle" font-size="9" fill="#c9d1d9">Hybrid Search</text>

  <!-- Router -> GraphRAG Smooth Spline -->
  <path d="M 365 235 C 450 235, 450 350, 450 470" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Pill Label: GraphRAG -->
  <rect x="425" y="330" width="52" height="18" rx="3" fill="#30363d"/>
  <text x="451" y="343" text-anchor="middle" font-size="9" fill="#c9d1d9">GraphRAG</text>

  <!-- 1.4 Query Transformation Box -->
  <rect x="115" y="310" width="150" height="34" rx="3" fill="#fffde7" stroke="#fb8c00" stroke-width="1.5"/>
  <text x="190" y="332" text-anchor="middle" font-size="11" font-weight="normal" fill="#e65100">Query Transformation</text>

  <!-- Split curves to HyDE and Decomposer -->
  <path d="M 190 344 C 190 360, 130 360, 130 380" fill="none" stroke="#8b949e" stroke-width="1.2"/>
  <path d="M 190 344 C 190 360, 260 360, 260 380" fill="none" stroke="#8b949e" stroke-width="1.2"/>

  <!-- HyDE Box -->
  <rect x="70" y="380" width="120" height="42" rx="3" fill="#fffde7" stroke="#fb8c00" stroke-width="1.5"/>
  <text x="130" y="398" text-anchor="middle" font-size="10" font-weight="normal" fill="#e65100">HyDE - Hypothetical</text>
  <text x="130" y="412" text-anchor="middle" font-size="10" font-weight="normal" fill="#e65100">Document</text>

  <!-- Decomposer Box -->
  <rect x="200" y="380" width="120" height="42" rx="3" fill="#fffde7" stroke="#fb8c00" stroke-width="1.5"/>
  <text x="260" y="405" text-anchor="middle" font-size="10" font-weight="normal" fill="#e65100">Decomposer - Subqueries</text>

  <!-- Merge curves to Hybrid Search Engine -->
  <path d="M 130 422 C 130 445, 190 445, 190 465" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 260 422 C 260 445, 190 445, 190 465" fill="none" stroke="#8b949e" stroke-width="1.2"/>

  <!-- 1.5 Hybrid Search Engine (Dark Pill/Box) -->
  <rect x="120" y="465" width="140" height="34" rx="3" fill="#1c2128" stroke="#444c56" stroke-width="1.5"/>
  <text x="190" y="487" text-anchor="middle" font-size="11" font-weight="normal" fill="#adbac7">Hybrid Search Engine</text>

  <!-- 1.6 GraphRAG Search (Green Box) -->
  <rect x="385" y="470" width="130" height="34" rx="3" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="450" y="492" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b5e20">GraphRAG Search</text>

  <!-- Smooth Curve from Hybrid Engine down to RRF -->
  <path d="M 190 499 C 190 560, 115 560, 115 625" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 1.7 RRF Fusion (Green Box) -->
  <rect x="70" y="625" width="90" height="34" rx="3" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="115" y="647" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b5e20">RRF Fusion</text>

  <!-- RRF -> Merge Candidates Smooth Curve -->
  <path d="M 115 659 C 115 690, 230 690, 230 705" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Pill Label: Top 50 Chunks -->
  <rect x="90" y="670" width="70" height="18" rx="3" fill="#30363d"/>
  <text x="125" y="683" text-anchor="middle" font-size="9" fill="#c9d1d9">Top 50 Chunks</text>

  <!-- 1.8 Merge Candidates (Green Box) -->
  <rect x="230" y="690" width="130" height="34" rx="3" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="295" y="712" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b5e20">Merge Candidates</text>

  <!-- Merge -> Cross-Encoder -->
  <line x1="295" y1="724" x2="295" y2="775" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Pill Label: 60 Chunks -->
  <rect x="270" y="740" width="50" height="18" rx="3" fill="#30363d"/>
  <text x="295" y="753" text-anchor="middle" font-size="9" fill="#c9d1d9">60 Chunks</text>

  <!-- 1.9 Cross-Encoder Reranker -->
  <rect x="215" y="775" width="160" height="34" rx="3" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="295" y="797" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b5e20">Cross-Encoder Reranker</text>

  <!-- Cross-Encoder -> MMR -->
  <line x1="295" y1="809" x2="295" y2="860" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Pill Label: Top 20 Chunks -->
  <rect x="260" y="825" width="70" height="18" rx="3" fill="#30363d"/>
  <text x="295" y="838" text-anchor="middle" font-size="9" fill="#c9d1d9">Top 20 Chunks</text>

  <!-- 1.10 MMR Diversity Filter -->
  <rect x="220" y="860" width="150" height="34" rx="3" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="295" y="882" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b5e20">MMR Diversity Filter</text>

  <!-- MMR -> Final Context -->
  <line x1="295" y1="894" x2="295" y2="935" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Pill Label: Top 10 Chunks -->
  <rect x="260" y="905" width="70" height="18" rx="3" fill="#30363d"/>
  <text x="295" y="918" text-anchor="middle" font-size="9" fill="#c9d1d9">Top 10 Chunks</text>

  <!-- 1.11 Final Context (Dark Box) -->
  <rect x="235" y="935" width="120" height="34" rx="3" fill="#1c2128" stroke="#444c56" stroke-width="1.5"/>
  <text x="295" y="957" text-anchor="middle" font-size="11" font-weight="normal" fill="#adbac7">Final Context</text>


  <!-- ========================================================================= -->
  <!-- 2. RIGHT SUBGRAPH: OFFLINE DATA INGESTION PIPELINE                        -->
  <!-- ========================================================================= -->
  <rect x="600" y="290" width="530" height="320" rx="4" fill="#2d333b" fill-opacity="0.4" stroke="#444c56" stroke-width="1.5"/>
  <text x="865" y="312" text-anchor="middle" font-size="12" font-weight="normal" fill="#adbac7" letter-spacing="0.5">
    OFFLINE DATA INGESTION PIPELINE
  </text>

  <!-- 2.1 Technical Docs (Dark Box) -->
  <rect x="800" y="325" width="130" height="34" rx="3" fill="#1c2128" stroke="#444c56" stroke-width="1.5"/>
  <text x="865" y="347" text-anchor="middle" font-size="11" font-weight="normal" fill="#adbac7">Gale Medical Docs</text>

  <!-- Arrow down -->
  <line x1="865" y1="359" x2="865" y2="390" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 2.2 Semantic Chunking (Green Box) -->
  <rect x="790" y="390" width="150" height="34" rx="3" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="865" y="412" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b5e20">Semantic Chunking</text>

  <!-- Split smooth curves to Ingestion Steps -->
  <path d="M 865 424 C 865 440, 685 440, 685 460" fill="none" stroke="#8b949e" stroke-width="1.2"/>
  <path d="M 865 424 L 865 460" fill="none" stroke="#8b949e" stroke-width="1.2"/>
  <path d="M 865 424 C 865 440, 1045 440, 1045 460" fill="none" stroke="#8b949e" stroke-width="1.2"/>

  <!-- Text Embeddings -->
  <rect x="625" y="460" width="120" height="34" rx="3" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="685" y="482" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b5e20">Text Embeddings</text>

  <!-- BM25 Indexing -->
  <rect x="805" y="460" width="120" height="34" rx="3" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="865" y="482" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b5e20">BM25 Indexing</text>

  <!-- LLM Entity-Relation Extract -->
  <rect x="975" y="460" width="140" height="34" rx="3" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="1045" y="482" text-anchor="middle" font-size="10" font-weight="normal" fill="#1b5e20">LLM Entity-Relation Extract</text>

  <!-- Arrows to DB Cylinders -->
  <line x1="685" y1="494" x2="685" y2="535" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="865" y1="494" x2="865" y2="535" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="1045" y1="494" x2="1045" y2="535" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 2.3 CYLINDER DATABASES -->
  <!-- Cylinder 1: Qdrant -->
  <g transform="translate(635, 535)">
    <path d="M 0 10 A 50 10 0 0 0 100 10 L 100 40 A 50 10 0 0 1 0 40 Z" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
    <ellipse cx="50" cy="10" rx="50" ry="10" fill="#bbdefb" stroke="#1e88e5" stroke-width="1.5"/>
    <text x="50" y="32" text-anchor="middle" font-size="10" font-weight="normal" fill="#0d47a1">Qdrant Vector DB</text>
  </g>

  <!-- Cylinder 2: BM25 -->
  <g transform="translate(815, 535)">
    <path d="M 0 10 A 50 10 0 0 0 100 10 L 100 40 A 50 10 0 0 1 0 40 Z" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
    <ellipse cx="50" cy="10" rx="50" ry="10" fill="#bbdefb" stroke="#1e88e5" stroke-width="1.5"/>
    <text x="50" y="32" text-anchor="middle" font-size="10" font-weight="normal" fill="#0d47a1">BM25 Retriever</text>
  </g>

  <!-- Cylinder 3: Neo4j -->
  <g transform="translate(995, 535)">
    <path d="M 0 10 A 50 10 0 0 0 100 10 L 100 40 A 50 10 0 0 1 0 40 Z" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
    <ellipse cx="50" cy="10" rx="50" ry="10" fill="#bbdefb" stroke="#1e88e5" stroke-width="1.5"/>
    <text x="50" y="32" text-anchor="middle" font-size="10" font-weight="normal" fill="#0d47a1">Neo4j Graph DB</text>
  </g>


  <!-- ========================================================================= -->
  <!-- 3. EXACT SMOOTH SPLINES (JUST LIKE SCREENSHOT)                           -->
  <!-- ========================================================================= -->
  <!-- Vector Search: Hybrid Engine -> Qdrant DB (Smooth downward-right curve) -->
  <path d="M 190 499 C 190 535, 635 520, 635 545" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="280" y="525" width="70" height="18" rx="3" fill="#30363d"/>
  <text x="315" y="538" text-anchor="middle" font-size="9" fill="#c9d1d9">Vector Search</text>

  <!-- Keyword Search: Hybrid Engine -> BM25 DB (Smooth downward-right curve) -->
  <path d="M 230 499 C 230 550, 815 525, 815 545" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="460" y="525" width="75" height="18" rx="3" fill="#30363d"/>
  <text x="497" y="538" text-anchor="middle" font-size="9" fill="#c9d1d9">Keyword Search</text>

  <!-- Entity Linking: GraphRAG Search -> Neo4j DB (Gentle right curve) -->
  <path d="M 450 504 C 450 520, 995 520, 995 545" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="430" y="505" width="70" height="18" rx="3" fill="#30363d"/>
  <text x="465" y="518" text-anchor="middle" font-size="9" fill="#c9d1d9">Entity Linking</text>

  <!-- RESPONSE 1: Qdrant DB -> RRF Fusion (Smooth sweeping curve down to left) -->
  <path d="M 685 580 C 685 620, 200 600, 160 630" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- RESPONSE 2: BM25 DB -> RRF Fusion (Smooth sweeping curve down to left) -->
  <path d="M 865 580 C 865 625, 220 610, 160 635" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- RESPONSE 3: Neo4j Graph DB -> Merge Candidates (Gentle sweeping curve down to Merge) -->
  <path d="M 1045 580 C 1045 660, 450 670, 360 700" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Pill Label: Top 10 Results -->
  <rect x="450" y="640" width="65" height="18" rx="3" fill="#30363d"/>
  <text x="482" y="653" text-anchor="middle" font-size="9" fill="#c9d1d9">Top 10 Results</text>


  <!-- ========================================================================= -->
  <!-- 4. BOTTOM SUBGRAPH: GENERATION PIPELINE                                  -->
  <!-- ========================================================================= -->
  <rect x="200" y="1030" width="190" height="215" rx="4" fill="#2d333b" fill-opacity="0.4" stroke="#444c56" stroke-width="1.5"/>
  <text x="295" y="1050" text-anchor="middle" font-size="11" font-weight="normal" fill="#adbac7" letter-spacing="0.5">
    GENERATION PIPELINE
  </text>

  <!-- Line from Final Context to Prompt Assembly -->
  <line x1="295" y1="969" x2="295" y2="1065" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 4.1 Prompt Assembly (Green Box) -->
  <rect x="235" y="1065" width="120" height="34" rx="3" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="295" y="1087" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b5e20">Prompt Assembly</text>

  <!-- Line to GPT-4o -->
  <line x1="295" y1="1099" x2="295" y2="1125" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 4.2 GPT-4o Generator (Purple Box) -->
  <rect x="235" y="1125" width="120" height="34" rx="3" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.5"/>
  <text x="295" y="1147" text-anchor="middle" font-size="11" font-weight="normal" fill="#4a148c">GPT-4o Generator</text>

  <!-- Async Cache Write-Back Smooth Curve -->
  <path d="M 355 1142 C 560 1142, 560 200, 380 148" fill="none" stroke="#f87171" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrowRed)"/>
  <rect x="495" y="660" width="90" height="20" rx="3" fill="#450a0a" stroke="#ef4444" stroke-width="0.8"/>
  <text x="540" y="674" text-anchor="middle" font-size="8" font-weight="normal" fill="#fca5a5">Async Cache Save</text>

  <!-- Line to Answer Output -->
  <line x1="295" y1="1159" x2="295" y2="1190" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 4.3 Answer Output (Pink Stadium/Pill with SSE label) -->
  <rect x="235" y="1190" width="120" height="32" rx="16" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.5"/>
  <text x="295" y="1210" text-anchor="middle" font-size="10" font-weight="normal" fill="#4a148c">Answer Output (SSE)</text>

</svg>