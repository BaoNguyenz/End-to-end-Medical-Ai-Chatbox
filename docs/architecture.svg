  <text x="480" y="465" text-anchor="middle" font-size="10" font-weight="bold" fill="#fca5a5">Dense (Qdrant)</text>

  <rect x="550" y="440" width="110" height="40" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="605" y="465" text-anchor="middle" font-size="10" font-weight="bold" fill="#6ee7b7">Sparse (BM25)</text>

