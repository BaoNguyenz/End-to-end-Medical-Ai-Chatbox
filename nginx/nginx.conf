# GaleMed AI - Nginx Reverse Proxy Configuration
# Provides:
#   1. Rate Limiting (5 requests/sec, burst 10) to guard OpenAI token spend
#   2. Low-latency SSE Streaming (proxy_buffering off)
#   3. Security Headers against Clickjacking & MIME-sniffing
#   4. Reverse Proxy routing to FastAPI backend container (web:8000)

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

upstream fastapi_backend {
    server web:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # Maximum client payload size (for document/query submissions)
    client_max_body_size 20M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # ── 1. Real-time Streaming SSE endpoint (No buffering) ──────────────────
    location /api/query/stream {
        limit_req zone=api_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;

        # Disable buffering so tokens stream immediately to browser
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Keep connection open for long streaming clinical responses
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 2. Standard API Endpoints (Rate Limited) ────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=15 nodelay;
        limit_req_status 429;

        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 3. Frontend UI & Static Assets ──────────────────────────────────────
    location / {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Custom Error for Rate Limit Exceeded
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"error": "Too Many Requests", "message": "Rate limit exceeded. Please wait a moment before sending more medical queries."}';
    }
}
