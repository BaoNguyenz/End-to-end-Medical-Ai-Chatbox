name: GaleMed AI - CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ── 1. CI: Lint & Automated Testing ───────────────────────
  lint-and-test:
    name: Lint & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: |
          uv sync --dev
          uv add ruff

      - name: Run Ruff Linter
        run: uv run ruff check . --select=E9,F63,F7,F82

      - name: Run Automated Pytest Suite
        run: uv run pytest tests/ -v

  # ── 2. CD: Deploy to Azure VM ────────────────────────────
  deploy-to-azure:
    name: Deploy to Azure VM
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          port: 22
          script: |
            cd ~/End-to-end-Medical-Ai-Chatbox
            git pull origin main
            docker compose up -d --build web nginx
            docker image prune -f

