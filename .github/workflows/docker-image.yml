name: GaleMed AI - CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # ============================================================
  #  Job 1: Python Code Quality & Syntax Verification
  # ============================================================
  code-quality:
    name: 🔍 Code Quality & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ruff & Linter Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Verify Python Compilation (Syntax Check)
        run: python -m compileall src app.py main.py

      - name: Run Ruff Linter (Critical Errors & Flakes)
        run: ruff check . --select=E9,F63,F7,F82 --output-format=github

  # ============================================================
  #  Job 2: Docker Build & Layer Caching
  # ============================================================
  docker-build:
    name: 🐳 Docker Build & Cache Verification
    needs: code-quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image with GHA Cache
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: |
            galemed-ai:latest
            galemed-ai:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
